<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Deck - Roguelike Card Game</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'float-up': 'float-up 2s ease-out forwards',
              'damage-number': 'damage-pop 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards',
              'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
              'float': 'float-gentle 4s ease-in-out infinite',
              'spin-slow': 'spin-slow 8s linear infinite',
              'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
            }
          }
        }
      }
    </script>
</head>
<body>
    <div id="root" class="h-screen w-screen relative bg-[url('https://images.unsplash.com/photo-1519074069444-1ba4fff66d16?q=80&w=2544&auto=format&fit=crop')] bg-cover bg-center">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-[2px]"></div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
